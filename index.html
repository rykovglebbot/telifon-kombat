<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Telifon Kombat</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            -webkit-tap-highlight-color: transparent; /* Убирает синюю подсветку при нажатии на телефоне */
            -webkit-touch-callout: none;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 94vh;
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
        }
        .header {
            font-size: 22px;
            font-weight: bold;
            color: #ffcc00;
            margin-top: 2px;
        }
        .score {
            font-size: 38px;
            font-weight: bold;
            margin: 2px 0;
        }
        .clicker-container {
            position: relative;
            cursor: pointer;
            touch-action: manipulation;
            outline: none;
        }
        .clicker-img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid #ffcc00;
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.4);
            transition: transform 0.1s ease-out;
            transform-origin: center center;
            outline: none;
        }
        .stats {
            font-size: 15px;
            color: #aaaaaa;
            margin: 4px 0;
        }
        /* Блок кнопок улучшений */
        .upgrades-wrapper {
            width: 95%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 2px;
        }
        .upgrade-btn {
            width: 100%;
            background: #2a2a2a;
            color: #ffcc00;
            border: 2px solid #ffcc00;
            padding: 8px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
        }
        .upgrade-btn:hover:not(:disabled) {
            background: #ffcc00;
            color: #000;
        }
        .upgrade-btn:disabled {
            background: #1a1a1a;
            color: #555555;
            border-color: #333333;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="header">Telifon Kombat</div>
    
    <div class="score" id="score">0</div>

    <div class="clicker-container" id="clickArea">
        <img src="tel.png" alt="Telifon" class="clicker-img" id="telImage">
    </div>

    <div class="stats">
        ⚡ Энергия: <span id="energy">1000</span> / <span id="maxEnergy">1000</span>
    </div>

    <!-- Кнопки улучшений -->
    <div class="upgrades-wrapper">
        <button class="upgrade-btn" id="clickUpgradeBtn" onclick="buyClickUpgrade()">
            <span id="clickUpgradeTitle">Сила клика</span><br>
            <span id="clickUpgradeInfo" style="font-size: 10px; font-weight: normal;">Цена: 2500 | Дает: +2</span>
        </button>

        <button class="upgrade-btn" id="energyUpgradeBtn" onclick="buyEnergyUpgrade()">
            <span id="energyUpgradeTitle">Запас энергии</span><br>
            <span id="energyUpgradeInfo" style="font-size: 10px; font-weight: normal;">Цена: 2000 | Макс: 2000</span>
        </button>

        <button class="upgrade-btn" id="regenUpgradeBtn" onclick="buyRegenUpgrade()">
            <span id="regenUpgradeTitle">Восстановление энергии</span><br>
            <span id="regenUpgradeInfo" style="font-size: 10px; font-weight: normal;">Цена: 3000 | Скорость: x1.5</span>
        </button>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
        }

        // Данные улучшений силы клика
        const clickUpgradesData = [
            { cost: 2500, power: 2 },
            { cost: 5000, power: 5 },
            { cost: 7500, power: 10 },
            { cost: 10000, power: 25 },
            { cost: 50000, power: 50 },
            { cost: 100000, power: 100 },
            { cost: 500000, power: 250 },
            { cost: 1000000, power: 500 }
        ];

        // Данные улучшений максимальной энергии
        const energyUpgradesData = [
            { cost: 2000, maxEnergy: 2000 },
            { cost: 3000, maxEnergy: 5000 },
            { cost: 5000, maxEnergy: 7500 },
            { cost: 7777, maxEnergy: 10000 },
            { cost: 10000, maxEnergy: 25000 },
            { cost: 15000, maxEnergy: 50000 },
            { cost: 17676, maxEnergy: 100000 },
            { cost: 20001, maxEnergy: 250000 }
        ];

        // Данные улучшений скорости восстановления энергии
        const regenUpgradesData = [
            { cost: 3000, multiplier: 1.5 },
            { cost: 6000, multiplier: 1.7 },
            { cost: 12000, multiplier: 2.0 },
            { cost: 25000, multiplier: 2.2 },
            { cost: 60000, multiplier: 2.5 },
            { cost: 120000, multiplier: 3.0 },
            { cost: 300000, multiplier: 5.0 },
            { cost: 800000, multiplier: 10.0 }
        ];

        // Загружаем сохраненные данные и уровни прокачки
        let score = parseInt(localStorage.getItem('telifon_score')) || 0;
        let clickUpgradeLevel = parseInt(localStorage.getItem('telifon_click_level')) || 0;
        let energyUpgradeLevel = parseInt(localStorage.getItem('telifon_energy_level')) || 0;
        let regenUpgradeLevel = parseInt(localStorage.getItem('telifon_regen_level')) || 0;

        // Проверка пользователей
        const tgUser = tg?.initDataUnsafe?.user;
        if (tgUser && tgUser.username) {
            const username = tgUser.username.toLowerCase();
            if (username === 'crystal671488') {
                if (score < 67676767) {
                    score = 67676767;
                    localStorage.setItem('telifon_score', score);
                }
            } else if (username === 'sestikk') {
                if (score < 20000000) {
                    score = 20000000;
                    localStorage.setItem('telifon_score', score);
                }
            }
        }

        function getClickPower() {
            if (clickUpgradeLevel === 0) return 1;
            return clickUpgradesData[clickUpgradeLevel - 1].power;
        }

        function getMaxEnergy() {
            if (energyUpgradeLevel === 0) return 1000;
            return energyUpgradesData[energyUpgradeLevel - 1].maxEnergy;
        }

        function getRegenMultiplier() {
            if (regenUpgradeLevel === 0) return 1.0;
            return regenUpgradesData[regenUpgradeLevel - 1].multiplier;
        }

        let clickPower = getClickPower();
        let maxEnergy = getMaxEnergy();

        // Расчет энергии с учетом офлайн-времени и скорости восстановления
        let savedEnergy = localStorage.getItem('telifon_energy');
        let lastTime = parseInt(localStorage.getItem('telifon_last_time')) || Date.now();
        let currentTime = Date.now();

        let energy = (savedEnergy !== null) ? parseFloat(savedEnergy) : maxEnergy;

        let elapsedSeconds = Math.floor((currentTime - lastTime) / 1000);
        if (elapsedSeconds > 0 && energy < maxEnergy) {
            let restored = elapsedSeconds * 3 * getRegenMultiplier();
            energy = Math.min(maxEnergy, energy + restored);
        }

        const scoreElement = document.getElementById('score');
        const energyElement = document.getElementById('energy');
        const maxEnergyElement = document.getElementById('maxEnergy');
        const clickArea = document.getElementById('clickArea');
        const telImage = document.getElementById('telImage');

        const clickUpgradeBtn = document.getElementById('clickUpgradeBtn');
        const clickUpgradeTitle = document.getElementById('clickUpgradeTitle');
        const clickUpgradeInfo = document.getElementById('clickUpgradeInfo');

        const energyUpgradeBtn = document.getElementById('energyUpgradeBtn');
        const energyUpgradeTitle = document.getElementById('energyUpgradeTitle');
        const energyUpgradeInfo = document.getElementById('energyUpgradeInfo');

        const regenUpgradeBtn = document.getElementById('regenUpgradeBtn');
        const regenUpgradeTitle = document.getElementById('regenUpgradeTitle');
        const regenUpgradeInfo = document.getElementById('regenUpgradeInfo');

        scoreElement.innerText = score;
        energyElement.innerText = Math.floor(energy);
        maxEnergyElement.innerText = maxEnergy;

        // Обновление интерфейса кнопок улучшений
        function updateUpgradesUI() {
            maxEnergy = getMaxEnergy();
            maxEnergyElement.innerText = maxEnergy;

            // Кнопка силы клика
            if (clickUpgradeLevel < clickUpgradesData.length) {
                const next = clickUpgradesData[clickUpgradeLevel];
                clickUpgradeTitle.innerText = `Сила клика #${clickUpgradeLevel + 1}`;
                clickUpgradeInfo.innerText = `Цена: ${next.cost.toLocaleString()} | Дает: +${next.power}`;
                clickUpgradeBtn.disabled = score < next.cost;
            } else {
                clickUpgradeTitle.innerText = "Сила клика: Максимум";
                clickUpgradeInfo.innerText = `Текущая сила: +${clickPower}`;
                clickUpgradeBtn.disabled = true;
            }

            // Кнопка запаса энергии
            if (energyUpgradeLevel < energyUpgradesData.length) {
                const next = energyUpgradesData[energyUpgradeLevel];
                energyUpgradeTitle.innerText = `Запас энергии #${energyUpgradeLevel + 1}`;
                energyUpgradeInfo.innerText = `Цена: ${next.cost.toLocaleString()} | Макс: ${next.maxEnergy.toLocaleString()}`;
                energyUpgradeBtn.disabled = score < next.cost;
            } else {
                energyUpgradeTitle.innerText = "Запас энергии: Максимум";
                energyUpgradeInfo.innerText = `Максимум: ${maxEnergy.toLocaleString()}`;
                energyUpgradeBtn.disabled = true;
            }

            // Кнопка скорости восстановления энергии
            if (regenUpgradeLevel < regenUpgradesData.length) {
                const next = regenUpgradesData[regenUpgradeLevel];
                regenUpgradeTitle.innerText = `Скорость энергии #${regenUpgradeLevel + 1}`;
                regenUpgradeInfo.innerText = `Цена: ${next.cost.toLocaleString()} | Скорость: x${next.multiplier}`;
                regenUpgradeBtn.disabled = score < next.cost;
            } else {
                regenUpgradeTitle.innerText = "Скорость энергии: Максимум";
                regenUpgradeInfo.innerText = `Множитель: x${getRegenMultiplier()}`;
                regenUpgradeBtn.disabled = true;
            }
        }

        // Покупка улучшения клика
        function buyClickUpgrade() {
            if (clickUpgradeLevel < clickUpgradesData.length) {
                const next = clickUpgradesData[clickUpgradeLevel];
                if (score >= next.cost) {
                    score -= next.cost;
                    clickUpgradeLevel += 1;
                    clickPower = getClickPower();

                    localStorage.setItem('telifon_score', score);
                    localStorage.setItem('telifon_click_level', clickUpgradeLevel);

                    scoreElement.innerText = score;
                    updateUpgradesUI();
                }
            }
        }

        // Покупка улучшения энергии
        function buyEnergyUpgrade() {
            if (energyUpgradeLevel < energyUpgradesData.length) {
                const next = energyUpgradesData[energyUpgradeLevel];
                if (score >= next.cost) {
                    score -= next.cost;
                    energyUpgradeLevel += 1;
                    maxEnergy = getMaxEnergy();
                    energy = maxEnergy;

                    localStorage.setItem('telifon_score', score);
                    localStorage.setItem('telifon_energy_level', energyUpgradeLevel);
                    localStorage.setItem('telifon_energy', energy);

                    scoreElement.innerText = score;
                    energyElement.innerText = Math.floor(energy);
                    maxEnergyElement.innerText = maxEnergy;
                    updateUpgradesUI();
                }
            }
        }

        // Покупка улучшения скорости восстановления
        function buyRegenUpgrade() {
            if (regenUpgradeLevel < regenUpgradesData.length) {
                const next = regenUpgradesData[regenUpgradeLevel];
                if (score >= next.cost) {
                    score -= next.cost;
                    regenUpgradeLevel += 1;

                    localStorage.setItem('telifon_score', score);
                    localStorage.setItem('telifon_regen_level', regenUpgradeLevel);

                    scoreElement.innerText = score;
                    updateUpgradesUI();
                }
            }
        }

        updateUpgradesUI();

        // Аудио и таймер (1 секунда звука)
        const clickSound = new Audio('ai.mp3');
        let pauseTimer = null;

        // Клик по персонажу
        clickArea.addEventListener('pointerdown', (e) => {
            if (energy >= clickPower) {
                score += clickPower;
                energy -= clickPower;
                
                scoreElement.innerText = score;
                energyElement.innerText = Math.floor(energy);

                localStorage.setItem('telifon_score', score);
                localStorage.setItem('telifon_energy', energy);
                localStorage.setItem('telifon_last_time', Date.now());
                updateUpgradesUI();

                if (clickSound.ended) {
                    clickSound.currentTime = 0;
                }

                clickSound.play().catch(error => {
                    console.log("Ошибка воспроизведения звука:", error);
                });

                if (pauseTimer) {
                    clearTimeout(pauseTimer);
                }

                pauseTimer = setTimeout(() => {
                    clickSound.pause();
                }, 1000);

                // Эффект сжатия и поворота
                const randomAngle = (Math.random() - 0.5) * 70; 
                const randomX = (Math.random() - 0.5) * 20;
                const randomY = (Math.random() - 0.5) * 20;

                telImage.style.transform = `translate(${randomX}px, ${randomY}px) rotate(${randomAngle}deg) scale(0.9)`;

                setTimeout(() => {
                    telImage.style.transform = 'translate(0px, 0px) rotate(0deg) scale(1)';
                }, 100);

                showFloatingText(e.clientX, e.clientY, `+${clickPower}`);
            }
        });

        // Автоматическое восстановление энергии в реальном времени с учетом множителя
        setInterval(() => {
            let currentMax = getMaxEnergy();
            if (energy < currentMax) {
                let regenAmount = 3 * getRegenMultiplier();
                energy += regenAmount;
                if (energy > currentMax) energy = currentMax;
                energyElement.innerText = Math.floor(energy);
                localStorage.setItem('telifon_energy', energy);
            }
            localStorage.setItem('telifon_last_time', Date.now());
        }, 1000);

        function showFloatingText(x, y, text) {
            const el = document.createElement('div');
            el.innerText = text;
            el.style.position = 'fixed';
            el.style.left = `${x || 200}px`;
            el.style.top = `${y || 300}px`;
            el.style.color = '#ffcc00';
            el.style.fontSize = '26px';
            el.style.fontWeight = 'bold';
            el.style.pointerEvents = 'none';
            el.style.zIndex = '1000';
            el.style.transition = 'transform 0.5s ease, opacity 0.5s ease';
            document.body.appendChild(el);

            setTimeout(() => {
                el.style.transform = 'translateY(-50px)';
                el.style.opacity = '0';
            }, 20);

            setTimeout(() => el.remove(), 500);
        }
    </script>
</body>
</html>
