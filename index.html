<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Telifon Kombat</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            -webkit-tap-highlight-color: transparent; /* Убирает синюю подсветку при нажатии на телефоне */
            -webkit-touch-callout: none;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 90vh;
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
        }
        .header {
            font-size: 26px;
            font-weight: bold;
            color: #ffcc00;
            margin-top: 5px;
        }
        .score {
            font-size: 48px;
            font-weight: bold;
            margin: 10px 0;
        }
        .clicker-container {
            position: relative;
            cursor: pointer;
            touch-action: manipulation;
            outline: none;
        }
        .clicker-img {
            width: 240px;
            height: 240px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid #ffcc00;
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.4);
            transition: transform 0.1s ease-out;
            transform-origin: center center;
            outline: none;
        }
        .stats {
            font-size: 18px;
            color: #aaaaaa;
            margin: 10px 0;
        }
        /* Стили для кнопки улучшений */
        .upgrade-container {
            width: 90%;
            max-width: 320px;
            margin: 10px 0;
        }
        .upgrade-btn {
            width: 100%;
            background: #2a2a2a;
            color: #ffcc00;
            border: 2px solid #ffcc00;
            padding: 12px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        .upgrade-btn:hover:not(:disabled) {
            background: #ffcc00;
            color: #000;
        }
        .upgrade-btn:disabled {
            background: #1a1a1a;
            color: #555555;
            border-color: #333333;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="header">Telifon Kombat</div>
    
    <div class="score" id="score">0</div>

    <div class="clicker-container" id="clickArea">
        <img src="tel.png" alt="Telifon" class="clicker-img" id="telImage">
    </div>

    <div class="stats">
        ⚡ Энергия: <span id="energy">1000</span> / 1000
    </div>

    <!-- Кнопка улучшений -->
    <div class="upgrade-container">
        <button class="upgrade-btn" id="upgradeBtn" onclick="buyUpgrade()">
            <span id="upgradeTitle">Улучшение клика</span><br>
            <span id="upgradeInfo" style="font-size: 12px; font-weight: normal;">Цена: 2500 | Дает: +2</span>
        </button>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
        }

        // Данные улучшений
        const upgradesData = [
            { cost: 2500, power: 2 },
            { cost: 5000, power: 5 },
            { cost: 7500, power: 10 },
            { cost: 10000, power: 25 },
            { cost: 50000, power: 50 },
            { cost: 100000, power: 100 },
            { cost: 500000, power: 250 },
            { cost: 1000000, power: 500 }
        ];

        // Загружаем сохраненный счет и уровень прокачки
        let score = parseInt(localStorage.getItem('telifon_score')) || 0;
        let upgradeLevel = parseInt(localStorage.getItem('telifon_upgrade_level')) || 0;

        // Проверка для твоего аккаунта
        const tgUser = tg?.initDataUnsafe?.user;
        if (tgUser && tgUser.username && tgUser.username.toLowerCase() === 'crystal671488') {
            if (score < 67676767) {
                score = 67676767;
                localStorage.setItem('telifon_score', score);
            }
        }

        // Функция определения текущей силы клика
        function getClickPower() {
            if (upgradeLevel === 0) return 1;
            return upgradesData[upgradeLevel - 1].power;
        }

        let clickPower = getClickPower();
        let energy = 1000;

        const scoreElement = document.getElementById('score');
        const energyElement = document.getElementById('energy');
        const clickArea = document.getElementById('clickArea');
        const telImage = document.getElementById('telImage');
        const upgradeBtn = document.getElementById('upgradeBtn');
        const upgradeTitle = document.getElementById('upgradeTitle');
        const upgradeInfo = document.getElementById('upgradeInfo');

        scoreElement.innerText = score;

        // Обновление состояния кнопки улучшений
        function updateUpgradeUI() {
            if (upgradeLevel < upgradesData.length) {
                const next = upgradesData[upgradeLevel];
                upgradeTitle.innerText = `Улучшение #${upgradeLevel + 1}`;
                upgradeInfo.innerText = `Цена: ${next.cost.toLocaleString()} | Дает: +${next.power}`;
                
                if (score >= next.cost) {
                    upgradeBtn.removeAttribute('disabled');
                } else {
                    upgradeBtn.setAttribute('disabled', 'true');
                }
            } else {
                upgradeTitle.innerText = "Максимальная прокачка!";
                upgradeInfo.innerText = `Сила клика: +${clickPower}`;
                upgradeBtn.setAttribute('disabled', 'true');
            }
        }

        // Покупка улучшения
        function buyUpgrade() {
            if (upgradeLevel < upgradesData.length) {
                const next = upgradesData[upgradeLevel];
                if (score >= next.cost) {
                    score -= next.cost;
                    upgradeLevel += 1;
                    clickPower = getClickPower();

                    localStorage.setItem('telifon_score', score);
                    localStorage.setItem('telifon_upgrade_level', upgradeLevel);

                    scoreElement.innerText = score;
                    updateUpgradeUI();
                }
            }
        }

        updateUpgradeUI();

        // Объект аудиофайла ai.mp3 и таймер паузы (1 секунда звука)
        const clickSound = new Audio('ai.mp3');
        let pauseTimer = null;

        // Клик по персонажу
        clickArea.addEventListener('pointerdown', (e) => {
            if (energy >= clickPower) {
                score += clickPower;
                energy -= clickPower;
                
                scoreElement.innerText = score;
                energyElement.innerText = energy;

                localStorage.setItem('telifon_score', score);
                updateUpgradeUI(); // Проверяем, хватает ли теперь монет на улучшение

                if (clickSound.ended) {
                    clickSound.currentTime = 0;
                }

                clickSound.play().catch(error => {
                    console.log("Ошибка воспроизведения звука:", error);
                });

                if (pauseTimer) {
                    clearTimeout(pauseTimer);
                }

                pauseTimer = setTimeout(() => {
                    clickSound.pause();
                }, 1000);

                // Эффект сжатия и поворота
                const randomAngle = (Math.random() - 0.5) * 70; 
                const randomX = (Math.random() - 0.5) * 20;
                const randomY = (Math.random() - 0.5) * 20;

                telImage.style.transform = `translate(${randomX}px, ${randomY}px) rotate(${randomAngle}deg) scale(0.9)`;

                setTimeout(() => {
                    telImage.style.transform = 'translate(0px, 0px) rotate(0deg) scale(1)';
                }, 100);

                showFloatingText(e.clientX, e.clientY, `+${clickPower}`);
            }
        });

        // Восстановление энергии (восстанавливаем по 3 единицы в секунду)
        setInterval(() => {
            if (energy < 1000) {
                energy += 3;
                if (energy > 1000) energy = 1000;
                energyElement.innerText = energy;
            }
        }, 1000);

        function showFloatingText(x, y, text) {
            const el = document.createElement('div');
            el.innerText = text;
            el.style.position = 'fixed';
            el.style.left = `${x || 200}px`;
            el.style.top = `${y || 300}px`;
            el.style.color = '#ffcc00';
            el.style.fontSize = '28px';
            el.style.fontWeight = 'bold';
            el.style.pointerEvents = 'none';
            el.style.zIndex = '1000';
            el.style.transition = 'transform 0.5s ease, opacity 0.5s ease';
            document.body.appendChild(el);

            setTimeout(() => {
                el.style.transform = 'translateY(-50px)';
                el.style.opacity = '0';
            }, 20);

            setTimeout(() => el.remove(), 500);
        }
    </script>
</body>
</html>
